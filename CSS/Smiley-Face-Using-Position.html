<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            width: 400px;
            height: 400px;
            background-color: #FFD93D;
            border-radius: 50%;
            position: relative;
        }
        .mouth {
            width: 200px;
            height: 100px;
            background-color: #a42020;
            border-radius: 0 0 100px 100px;
            position: absolute;
            top:260px;
            left:100px;
        }
      
        .left-eye , .right-eye2 {
            width: 75px;
            height: 75px;
            background-color: #171616;
            border-radius: 50%;
            position: absolute;

        }
        .left-eye {
            top: 100px;
            left: 80px;
        }
        .right-eye2 {
            top: 100px;
            right: 80px;
        }
        .nose {
            position: absolute;
            height: 75px;
            width: 50px;
            background-color: #82481a;
            top: 160px;
            left: 175px;
            border-radius: 50%;
        }
            
    </style>
</head>
<body>
    <div class="face">
        <div class="eyes">
            <div class="left-eye"></div>
            <div class="right-eye2"></div>
        </div>
        <div class="nose"></div>
        <div class="mouth"></div>
    </div>
</body>
</html>
